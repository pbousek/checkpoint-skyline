global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus receives data exclusively via Remote Write from the Check Point OpenTelemetry Collector.
# Endpoint: https://<this-server>:9090/api/v1/write
# No local scrape targets configured.

# To enable Alertmanager, uncomment:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["localhost:9093"]

# rule_files:
#   - /etc/prometheus/rules/*.rules

scrape_configs: []
