services:

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Port 9090 must be reachable from the Check Point network for Remote Write.
      # Recommended: restrict with firewall to the collector IP only.
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/web.yml:/etc/prometheus/web.yml:ro
      - ./certs:/etc/prometheus/certs:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    restart: unless-stopped
    # Grafana port is not exposed directly -- Caddy handles external access (see below).
    # To access Grafana directly without Caddy, uncomment:
    # ports:
    #   - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-localhost}
      - PROMETHEUS_AUTH_USER=${PROMETHEUS_AUTH_USER:-skyline}
      - PROMETHEUS_AUTH_PASSWORD=${PROMETHEUS_AUTH_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Caddy -- reverse proxy with TLS in front of Grafana.
  # TLS mode is controlled by CADDY_TLS_MODE in .env (run setup.sh to apply).
  #
  # To use a different reverse proxy (nginx, Traefik, Apache...):
  #   1. Uncomment ports: above in the grafana service
  #   2. Remove or comment out this section
  #   3. Configure your proxy to forward to localhost:${GRAFANA_PORT:-3000}
  #      and set X-Forwarded-For / X-Real-IP headers as needed
  caddy:
    image: caddy:${CADDY_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/grafana.crt:/etc/caddy/certs/grafana.crt:ro
      - ./certs/grafana.key:/etc/caddy/certs/grafana.key:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN:-monitoring.example.com}
    depends_on:
      - grafana

  # Alertmanager -- disabled, uncomment when needed
  #
  # alertmanager:
  #   image: prom/alertmanager:${ALERTMANAGER_VERSION:-latest}
  #   restart: unless-stopped
  #   ports:
  #     - "${ALERTMANAGER_PORT:-9093}:9093"
  #   volumes:
  #     - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  #     - alertmanager_data:/alertmanager
  #   command:
  #     - --config.file=/etc/alertmanager/alertmanager.yml
  #     - --storage.path=/alertmanager

volumes:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  # alertmanager_data:
